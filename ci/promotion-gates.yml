# CI workflow stub: staging promotion gates
# Gate 6 in ADR 001 acceptance gate
#
# Not registered under .github/workflows/. Do not copy it there until the
# steps are real. Each unfinished step exits 1 so a release branch cannot
# report "all gates passed" from echo TODOs.
#
# Trigger: release branch push, manual promotion request
#
# Gates (all must pass):
#   1. Migration dry-run: apply against clean DB + representative snapshot
#   2. RLS regression: full authz test matrix (calls rls-regression workflow)
#   3. Contract tests: API contract suite against managed and self-host targets
#   4. Restore smoke: backup/restore cycle proves data integrity
#
# Failure blocks promotion until fixed or explicitly waived.

name: promotion-gates

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

jobs:
  migration-dry-run:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: cestovni_test
          POSTGRES_USER: cestovni_test
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Clean DB migration dry-run
        run: echo "Gate 6 not implemented: apply all migrations to a clean DB" && exit 1
      - name: Snapshot DB migration dry-run
        run: echo "Gate 6 not implemented: apply migrations to a representative snapshot" && exit 1

  rls-regression:
    needs: migration-dry-run
    uses: ./.github/workflows/rls-regression.yml

  contract-tests:
    needs: migration-dry-run
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [managed, self-host]
    steps:
      - uses: actions/checkout@v4
      - name: Run contract tests (${{ matrix.target }})
        run: echo "Gate 6 not implemented: tests/contract against ${{ matrix.target }}" && exit 1

  restore-smoke:
    needs: migration-dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup, restore, and verify
        run: |
          echo "Gate 6 not implemented: pg_dump, pg_restore, migrate, and a signed-in read"
          exit 1

  gate-summary:
    needs: [migration-dry-run, rls-regression, contract-tests, restore-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: All gates passed
        run: echo "Reached only when migration, RLS, contract, and restore-smoke jobs succeed."
