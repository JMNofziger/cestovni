# RLS / authorization regression (Gate 4, ADR 001). Callable from promotion
# workflows via workflow_call; also trigger on migration / RLS test changes.

name: rls-regression

on:
  workflow_call:

  pull_request:
    paths:
      - 'db/**'
      - 'migrations/**'
      - 'tests/rls/**'
      - '.github/workflows/rls-regression.yml'
      - 'ci/rls-regression.yml'

jobs:
  rls-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: cestovni_test
          POSTGRES_USER: cestovni_test
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cestovni_test -d cestovni_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations and run RLS tests
        env:
          DATABASE_URL: postgresql://cestovni_test:testpass@127.0.0.1:5432/cestovni_test
        run: |
          set -o pipefail
          mkdir -p test-results
          ./tests/rls/run.sh | tee test-results/rls.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-regression-results
          path: test-results/
          if-no-files-found: ignore
