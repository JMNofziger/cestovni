# RETIRED 2026-11-05. iPhone PWA-lite is not the web client.
# Push and pull_request deploys are off so this prototype is not republished
# by accident. workflow_dispatch remains only to publish a retirement banner
# or to take the old Pages project down. See docs/archive/pwa-lite/README.md.

name: 'PWA-lite Pages deploy (retired)'

on:
  workflow_dispatch:

concurrency:
  group: pwa-lite-pages-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy client/web-lite to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy client/web-lite --project-name=cestovni-pwa
